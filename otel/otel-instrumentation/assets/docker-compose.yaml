version: "3.7"

x-name: &compose-project-name simple-lgtm

services:

  lgtm:
    container_name: lgtm
    image: grafana/otel-lgtm@sha256:069e79be4fcc648b13f22ded28146f0b2d94f7f48681a55aa4995566a0bbdd02
    ports:
      - "3000:3000"
    restart: unless-stopped

  alloy:
    container_name: alloy
    image: grafana/alloy:v1.9.0@sha256:32bc0ba6bad75ca24bdf4a6d2dd793a564dff06b6446927699c08d9f9c749c6e
    ports:
      - "12345:12345"
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    volumes:
      - "/root/course/config.alloy:/etc/alloy/config.alloy"
    command: [
      "run",
      "--server.http.listen-addr=0.0.0.0:12345",
      "--stability.level=public-preview",
      "/etc/alloy/config.alloy",
    ]
    restart: unless-stopped
