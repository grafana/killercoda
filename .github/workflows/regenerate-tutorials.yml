name: Regenerate tutorials

permissions: {}

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  main:
    permissions:
      contents: write
      pull-requests: write
    if: github.repository == 'grafana/killercoda'
    runs-on: ubuntu-latest
    steps:
      # Check out all the repositories that contain documentation sources from which we generate tutorials.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: loki
          persist-credentials: false
          repository: grafana/loki
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: grafana
          persist-credentials: false
          repository: grafana/grafana
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: alloy
          persist-credentials: false
          repository: grafana/alloy
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tempo
          persist-credentials: false
          repository: grafana/tempo
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: mimir
          persist-credentials: false
          repository: grafana/mimir
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: pyroscope
          persist-credentials: false
          repository: grafana/pyroscope
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: killercoda
          persist-credentials: false
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: killercoda/tools/transformer/go.mod
      - run: go build ./
        working-directory: killercoda/tools/transformer
      - run: ./scripts/check-out-branch.bash
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: killercoda
      # Run the transformer on all documentation sources.
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/loki/docs/sources/get-started/quick-start/quick-start.md"
          "${GITHUB_WORKSPACE}/killercoda/loki/loki-quickstart"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/loki/docs/sources/get-started/quick-start/tutorial.md"
          "${GITHUB_WORKSPACE}/killercoda/loki/loki-getting-started-tutorial"
        working-directory: killercoda/tools/transformer        
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/loki/docs/sources/send-data/alloy/examples/alloy-kafka-logs.md"
          "${GITHUB_WORKSPACE}/killercoda/loki/alloy-kafka-logs"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/loki/docs/sources/send-data/alloy/examples/alloy-otel-logs.md"
          "${GITHUB_WORKSPACE}/killercoda/loki/alloy-otel-logs"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/loki/docs/sources/send-data/otel/otel-collector-getting-started.md"
          "${GITHUB_WORKSPACE}/killercoda/loki/otel-collector-getting-started"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/loki/docs/sources/send-data/fluentbit/fluent-bit-loki-tutorial.md"
          "${GITHUB_WORKSPACE}/killercoda/loki/fluentbit-loki-tutorial"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/loki/docs/sources/query/logcli/logcli-tutorial.md"
          "${GITHUB_WORKSPACE}/killercoda/loki/logcli-tutorial"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/loki/docs/sources/send-data/k8s-monitoring-helm/_index.md"
          "${GITHUB_WORKSPACE}/killercoda/loki/k8s-monitoring-helm"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/grafana/docs/sources/tutorials/alerting-get-started/index.md"
          "${GITHUB_WORKSPACE}/killercoda/grafana/alerting-get-started"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/grafana/docs/sources/tutorials/alerting-get-started-pt2/index.md"
          "${GITHUB_WORKSPACE}/killercoda/grafana/alerting-get-started-pt2"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/grafana/docs/sources/tutorials/alerting-get-started-pt3/index.md"
          "${GITHUB_WORKSPACE}/killercoda/grafana/alerting-get-started-pt3"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/grafana/docs/sources/tutorials/alerting-get-started-pt4/index.md"
          "${GITHUB_WORKSPACE}/killercoda/grafana/alerting-get-started-pt4"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/grafana/docs/sources/tutorials/alerting-get-started-pt5/index.md"
          "${GITHUB_WORKSPACE}/killercoda/grafana/alerting-get-started-pt5"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/alloy/docs/sources/tutorials/send-logs-to-loki.md"
          "${GITHUB_WORKSPACE}/killercoda/alloy/send-logs-to-loki"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/grafana/docs/sources/tutorials/grafana-fundamentals/index.md"
          "${GITHUB_WORKSPACE}/killercoda/grafana/grafana-fundamentals"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/grafana/docs/sources/tutorials/create-alerts-with-logs/index.md"
          "${GITHUB_WORKSPACE}/killercoda/grafana/alerting-loki-logs"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/alloy/docs/sources/tutorials/send-metrics-to-prometheus.md"
          "${GITHUB_WORKSPACE}/killercoda/alloy/send-metrics-to-prometheus"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/tempo/docs/sources/tempo/getting-started/docker-example.md"
          "${GITHUB_WORKSPACE}/killercoda/tempo/quick-start"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/mimir/docs/sources/mimir/get-started/play-with-grafana-mimir/index.md"
          "${GITHUB_WORKSPACE}/killercoda/mimir/play-with-mimir"
        working-directory: killercoda/tools/transformer
      - run: >
          ./transformer
          "${GITHUB_WORKSPACE}/pyroscope/docs/sources/get-started/ride-share-tutorial.md"
          "${GITHUB_WORKSPACE}/killercoda/pyroscope/ride-share-tutorial"
        working-directory: killercoda/tools/transformer
      - run: ./scripts/manage-pr.bash
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: killercoda
